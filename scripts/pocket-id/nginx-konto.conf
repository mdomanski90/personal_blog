# P7a: konto.odniepamieci.pl → Pocket ID (127.0.0.1:1411). Certyfikat i przekierowanie na HTTPS dopisuje certbot (--nginx).
server {
    listen 80;
    listen [::]:80;
    server_name konto.odniepamieci.pl;

    # Pocket ID wysyła duże nagłówki (zalecenie z dokumentacji Pocket ID)
    proxy_busy_buffers_size 512k;
    proxy_buffers 4 512k;
    proxy_buffer_size 256k;

    location / {
        proxy_pass http://127.0.0.1:1411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
